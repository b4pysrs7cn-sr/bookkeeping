<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>单日记账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    background: #f2f2f7;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;   /* 裁剪屏幕外的视图，日视图只在推入时可见 */
  }

  /* ===== 双视图切换：iOS 推入/弹出 + 视差 ===== */
  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
  }

  /* 月视图：作为底层屏幕，被推入时左移 28% 并压暗 */
  .month-view {
    transform: translateX(0);
    pointer-events: auto;
  }
  .month-view.pushed {
    transform: translateX(-28%);
    pointer-events: none;   /* 被压到底层时禁止交互 */
  }
  .month-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .month-view.pushed::after { opacity: 0.14; }

  /* 日视图：实体卡片从右侧推入，左侧露出月视图边缘（iOS sheet 风格） */
  .day-view {
    width: 94%;
    background: #f2f2f7;
    border-radius: 18px 0 0 18px;
    box-shadow: -10px 0 30px rgba(0,0,0,0.18);
    overflow: hidden;   /* 让头部毛玻璃贴合卡片圆角 */
    transform: translateX(106%);
  }
  .day-view.active {
    transform: translateX(0);
    pointer-events: auto;
  }

  /* ===== 月视图 ===== */
  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .month-title { font-size: 20px; font-weight: 700; }
  .nav-btn {
    border: none;
    background: rgba(118,118,128,0.12);
    color: #007aff;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .nav-btn:active { transform: scale(0.9); }
  .calendar-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 40px;
  }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 12px;
    color: #8e8e93;
    margin-bottom: 8px;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-cell {
    background: #fff;
    border-radius: 10px;
    height: 62px;              /* 固定高度，所有格子大小一致 */
    padding: 6px 4px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cal-cell:active { transform: scale(0.93); }
  .cal-cell.blank { background: transparent; cursor: default; }
  /* 未来日期：可点开查看，但不能记账（置灰示意） */
  .cal-cell.future {
    opacity: 0.45;
    background: #fafafa;
  }
  .cal-cell .day-num { font-size: 15px; font-weight: 600; }
  .cal-cell.today .day-num {
    background: #007aff;
    color: #fff;
    width: 24px; height: 24px;
    line-height: 24px;
    border-radius: 50%;
  }
  .cal-cell .day-net {
    font-size: 10px;
    margin-top: 5px;
    white-space: nowrap;
    font-weight: 600;
  }
  .day-net.pos { color: #34c759; }
  .day-net.neg { color: #ff3b30; }

  .cal-hint {
    text-align: center;
    color: #c7c7cc;
    font-size: 12px;
    margin-top: 16px;
  }

  /* ===== 日视图 ===== */
  .day-header-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    border: none;
    background: transparent;
    color: #007aff;
    font-size: 26px;
    line-height: 1;
    padding: 0 4px;
    cursor: pointer;
    margin-left: -6px;
  }
  .back-btn:active { opacity: 0.5; }

  /* ===== 上栏：日期 + 收入/支出 ===== */
  .header {
    background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.7));
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 26px 20px 20px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .date-title { font-size: 22px; color: #1c1c1e; font-weight: 700; letter-spacing: 0.2px; }
  .today-chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #0a84ff, #0066d6);
    border-radius: 20px;
    padding: 2px 8px;
    margin-left: 4px;
    vertical-align: 3px;
  }
  .amounts { display: flex; gap: 28px; margin-top: 8px; }
  .amount-item .label { font-size: 12px; color: #8e8e93; }
  .amount-item .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .amount-item.expense .value { color: #ff3b30; }
  .amount-item.income  .value { color: #34c759; }

  /* ===== 账单列表 ===== */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 100px;
  }
  .empty {
    text-align: center;
    color: #c7c7cc;
    font-size: 14px;
    margin-top: 80px;
    line-height: 2;
  }
  .empty .empty-icon { font-size: 44px; display: block; margin-bottom: 8px; }
  /* 未来日期的日视图提示：图标轻轻浮动 */
  .empty.future-hint .empty-icon { animation: floatY 2.4s ease-in-out infinite; }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .bill {
    background: #fff;
    border-radius: 16px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.05);
    animation: billIn 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1),
                opacity 0.4s cubic-bezier(0.32, 0.72, 0, 1),
                margin-bottom 0.4s cubic-bezier(0.32, 0.72, 0, 1),
                box-shadow 0.3s;
  }
  /* 未展开时按下：iOS 卡片按压反馈 */
  .bill:not(.expanded):active {
    transform: scale(0.97);
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  /* 内容层：盖在按钮上层，展开时整体左移让出按钮位置（iOS 邮件结构） */
  .bill-main {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    background: #fff;
    position: relative;
    z-index: 2;
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .bill.expanded .bill-main { transform: translateX(-168px); }
  /* 手势拖拽中：关闭过渡，位置完全跟手 */
  .bill-main.dragging { transition: none; }
  /* 删除时：左滑淡出 + 缩小，苹果式曲线 */
  .bill.removing {
    transform: translateX(-70%) scale(0.85);
    opacity: 0;
    margin-bottom: 0;
  }
  @keyframes billIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .bill .icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(0,122,255,0.1);
    color: #007aff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    margin-right: 12px;
  }
  .bill .icon.expense { background: rgba(255,59,48,0.1); color: #ff3b30; }
  .bill .icon.income  { background: rgba(52,199,89,0.1); color: #34c759; }
  .bill .info { flex: 1; }
  .bill .info .name { font-size: 16px; font-weight: 600; }
  .bill .info .time { font-size: 12px; color: #8e8e93; margin-top: 2px; }
  .bill .num { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bill .num.expense { color: #ff3b30; }
  .bill .num.income  { color: #34c759; }

  /* 右侧操作层：iOS 邮件原生风格（通栏纯色块 + 白字居中），展开时丝滑浮现 */
  .bill-actions {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    display: flex;
    z-index: 1;
    opacity: 0;
    transform: translateX(24px);
    transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1),
                transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .bill.expanded .bill-actions {
    opacity: 1;
    transform: translateX(0);
  }
  .bill-actions button {
    width: 84px;
    height: 100%;
    border: none;
    border-radius: 0;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.2s;
  }
  .bill-actions .swipe-edit { background: #8e8e93; }
  .bill-actions .swipe-del  { background: #ff3b30; }
  .bill-actions button:active { filter: brightness(0.85); }

  /* ===== 加号按钮 ===== */
  .fab {
    position: absolute;
    right: 20px; bottom: 28px;
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #0a84ff, #0066d6);
    color: #fff;
    font-size: 30px;
    box-shadow: 0 8px 24px rgba(0,122,255,0.42), 0 2px 6px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s, visibility 0.3s;
    z-index: 10;
  }
  .fab:active { transform: scale(0.88); }
  .fab.hide { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(0.6); }

  /* 隐藏滚动条，界面更干净 */
  .list::-webkit-scrollbar,
  .calendar-wrap::-webkit-scrollbar { display: none; }
  .list, .calendar-wrap { scrollbar-width: none; }

  /* ===== 数字键盘面板 ===== */
  .mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 20;
  }
  .mask.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: #f7f7f9;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 30;
  }
  .sheet.show { transform: translateY(0); }

  .sheet-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  /* 收入/支出切换 */
  .type-toggle {
    display: flex;
    background: rgba(118,118,128,0.12);
    border-radius: 9px;
    padding: 2px;
  }
  .type-toggle button {
    border: none;
    background: transparent;
    padding: 6px 18px;
    font-size: 14px;
    border-radius: 7px;
    color: #8e8e93;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .type-toggle button.active-expense { background: #fff; color: #ff3b30; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .type-toggle button.active-income  { background: #fff; color: #34c759; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

  .close-btn {
    border: none;
    background: rgba(118,118,128,0.12);
    color: #8e8e93;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
  }
  .close-btn:active { transform: scale(0.9); }

  /* 金额显示 */
  .amount-display {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
  }
  .amount-display .symbol { font-size: 26px; font-weight: 700; color: #8e8e93; margin-right: 6px; }
  .amount-display .input {
    font-size: 36px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-height: 44px;
  }
  .amount-display.expense-mode .input,
  .amount-display.expense-mode .symbol { color: #ff3b30; }
  .amount-display.income-mode .input,
  .amount-display.income-mode .symbol { color: #34c759; }
  .amount-display .caret {
    width: 2px; height: 34px;
    background: #007aff;
    animation: blink 1s steps(1) infinite;
    display: none;
  }
  .amount-display.show-caret .caret { display: block; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 分类选择 */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .cat-grid button {
    border: none;
    background: rgba(118,118,128,0.12);
    border-radius: 12px;
    padding: 8px 0 6px;
    font-size: 11px;
    color: #3a3a3c;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cat-grid button .emoji { font-size: 20px; line-height: 1; }
  .cat-grid button:active { transform: scale(0.92); }
  .cat-grid button.selected {
    background: #007aff;
    color: #fff;
    transform: scale(1.02);
  }

  .note-input {
    width: 100%;
    border: none;
    background: rgba(118,118,128,0.12);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
  }

  /* 键盘 */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .keypad button {
    border: none;
    border-radius: 12px;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 600;
    background: #fff;
    color: #1c1c1e;
    cursor: pointer;
    transition: filter 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .keypad button:active { filter: brightness(0.85); }
  .keypad .fn { background: rgba(118,118,128,0.12); color: #1c1c1e; font-size: 17px; }
  .keypad .save {
    grid-row: span 2;
    background: #007aff;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
  }
  .keypad .save:disabled { background: #b0d4ff; }
</style>
</head>
<body>
<div class="phone">

  <!-- ===== 月视图 ===== -->
  <div class="view month-view active" id="monthView">
    <div class="header">
      <div class="month-nav">
        <button class="nav-btn" id="prevMonth">‹</button>
        <div class="month-title" id="monthTitle"></div>
        <button class="nav-btn" id="nextMonth">›</button>
      </div>
      <div class="amounts">
        <div class="amount-item expense">
          <div class="label">支出</div>
          <div class="value" id="monthExpense">0.00</div>
        </div>
        <div class="amount-item income">
          <div class="label">收入</div>
          <div class="value" id="monthIncome">0.00</div>
        </div>
      </div>
    </div>
    <div class="calendar-wrap">
      <div class="weekday-row">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar" id="calendar"></div>

      <div class="cal-hint">绿色为当日结余增加，红色为减少 · 点击日期查看当日账单</div>
    </div>
  </div>

  <!-- ===== 日视图 ===== -->
  <div class="view day-view" id="dayView">
    <!-- 上栏 -->
    <div class="header">
      <div class="day-header-row">
        <button class="back-btn" id="backBtn">‹</button>
        <div class="date-title" id="dateTitle"></div>
      </div>
      <div class="amounts">
        <div class="amount-item expense">
          <div class="label">支出</div>
          <div class="value" id="totalExpense">0.00</div>
        </div>
        <div class="amount-item income">
          <div class="label">收入</div>
          <div class="value" id="totalIncome">0.00</div>
        </div>
        <div class="amount-item">
          <div class="label">当日结余</div>
          <div class="value" id="dayNet">0.00</div>
        </div>
      </div>
    </div>

    <!-- 账单列表 -->
    <div class="list" id="list"></div>

    <!-- 加号按钮 -->
    <button class="fab" id="fab">+</button>
  </div>

  <!-- 遮罩 -->
  <div class="mask" id="mask"></div>

  <!-- 数字键盘面板 -->
  <div class="sheet" id="sheet">
    <div class="sheet-top">
      <div class="type-toggle">
        <button id="btnExpense" class="active-expense" onclick="setType('expense')">支出</button>
        <button id="btnIncome" onclick="setType('income')">收入</button>
      </div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>

    <div class="amount-display expense-mode show-caret" id="amountDisplay">
      <span class="symbol">¥</span>
      <span class="input" id="amountInput">0</span>
      <span class="caret"></span>
    </div>

    <!-- 分类选择 -->
    <div class="cat-grid" id="catGrid"></div>

    <input class="note-input" id="noteInput" placeholder="点击填写备注..." maxlength="20">

    <div class="keypad" id="keypad">
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="fn" data-key="del">⌫</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="fn" data-key="clear">清空</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="save" id="saveBtn" data-key="save">保存</button>
      <button data-key="0">0</button>
      <button data-key="00">00</button>
      <button data-key=".">.</button>
    </div>
  </div>

</div>

<script>
  // ===== 数据层（localStorage 封装，便于以后迁移后端） =====
  const STORE_KEY = 'dayBills';
  function loadBills() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function saveBills(bills) {
    localStorage.setItem(STORE_KEY, JSON.stringify(bills));
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function formatCN(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${y}年${+m}月${+d}日`;
  }

  // ===== 状态 =====
  let bills = loadBills();
  let curDate = todayStr();      // 日视图当前日期
  let viewDate = new Date();     // 月视图当前查看的年月
  let curType = 'expense';   // 记账时选择收入或支出
  let amount = '0';          // 金额用字符串操作
  let curCat = null;         // 当前选中的分类

  // ===== 分类（贴合大学生消费场景） =====
  const CATEGORIES = {
    expense: [
      { id: 'food',    emoji: '🍚', name: '餐饮' },
      { id: 'study',   emoji: '📚', name: '学习' },
      { id: 'traffic', emoji: '🚌', name: '交通' },
      { id: 'medical', emoji: '💊', name: '医药' },
      { id: 'daily',   emoji: '🧴', name: '日用' },
      { id: 'shop',    emoji: '🛍️', name: '购物' },
      { id: 'fun',     emoji: '🎮', name: '娱乐' },
      { id: 'social',  emoji: '🍻', name: '社交' },
      { id: 'bill',    emoji: '💡', name: '水电' },
      { id: 'other',   emoji: '📦', name: '其他' },
    ],
    income: [
      { id: 'allowance', emoji: '🏠', name: '生活费' },
      { id: 'parttime',  emoji: '💼', name: '兼职' },
      { id: 'scholar',   emoji: '🏆', name: '奖学金' },
      { id: 'redpack',   emoji: '🧧', name: '红包' },
      { id: 'other',     emoji: '📦', name: '其他' },
    ]
  };

  function renderCategories() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = CATEGORIES[curType].map(c => `
      <button data-cat="${c.id}" class="${curCat === c.id ? 'selected' : ''}">
        <span class="emoji">${c.emoji}</span><span>${c.name}</span>
      </button>
    `).join('');
  }

  document.getElementById('catGrid').addEventListener('click', e => {
    const btn = e.target.closest('button[data-cat]');
    if (!btn) return;
    curCat = btn.dataset.cat;
    renderCategories();
  });

  // ===== 视图切换 =====
  const dayView = document.getElementById('dayView');
  const monthView = document.getElementById('monthView');

  function showDay() {
    renderDay();
    monthView.classList.add('pushed');
    dayView.classList.add('active');
  }
  function showMonth() {
    renderMonth();
    dayView.classList.remove('active');
    monthView.classList.remove('pushed');
  }

  // ===== 月视图渲染 =====
  function renderMonth() {
    const y = viewDate.getFullYear();
    const m = viewDate.getMonth();
    document.getElementById('monthTitle').textContent = `${y}年${m + 1}月`;

    // 当月汇总
    const prefix = `${y}-${String(m + 1).padStart(2, '0')}`;
    let mExp = 0, mInc = 0;
    bills.forEach(b => {
      if (b.date.startsWith(prefix)) {
        b.type === 'expense' ? mExp += b.amount : mInc += b.amount;
      }
    });
    document.getElementById('monthExpense').textContent = mExp.toFixed(2);
    document.getElementById('monthIncome').textContent = mInc.toFixed(2);

    // 日历网格：'0 号' 技巧获取当月天数和首日星期
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const firstWeekday = new Date(y, m, 1).getDay();
    const today = todayStr();

    let html = '';
    for (let i = 0; i < firstWeekday; i++) {
      html += '<div class="cal-cell blank"></div>';
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${prefix}-${String(d).padStart(2, '0')}`;
      let dExp = 0, dInc = 0;
      bills.forEach(b => {
        if (b.date === dateStr) b.type === 'expense' ? dExp += b.amount : dInc += b.amount;
      });
      const dNet = dInc - dExp;

      html += `
        <div class="cal-cell ${dateStr === today ? 'today' : ''} ${dateStr > today ? 'future' : ''}" data-date="${dateStr}">
          <div class="day-num">${d}</div>
          ${dExp + dInc > 0 ? `<div class="day-net ${dNet >= 0 ? 'pos' : 'neg'}">${dNet >= 0 ? '+' : '-'}${Math.abs(dNet).toFixed(Math.abs(dNet) % 1 ? 2 : 0)}</div>` : ''}
        </div>`;
    }
    document.getElementById('calendar').innerHTML = html;
  }

  // ===== 渲染日视图 =====
  function renderDay() {
    const dayBills = bills.filter(b => b.date === curDate)
                          .sort((a, b) => b.ts - a.ts);

    // 上栏汇总
    let tExp = 0, tInc = 0;
    dayBills.forEach(b => b.type === 'expense' ? tExp += b.amount : tInc += b.amount);
    document.getElementById('totalExpense').textContent = tExp.toFixed(2);
    document.getElementById('totalIncome').textContent = tInc.toFixed(2);
    // 当日结余（收入 - 支出），正绿负红
    const net = tInc - tExp;
    const netEl = document.getElementById('dayNet');
    netEl.textContent = (net >= 0 ? '+' : '-') + Math.abs(net).toFixed(2);
    netEl.style.color = net >= 0 ? '#34c759' : '#ff3b30';
    // 标题：日期 + 星期 + 今天徽标（注意用本地时区解析日期）
    const wd = '日一二三四五六'[new Date(curDate.replace(/-/g, '/')).getDay()];
    document.getElementById('dateTitle').innerHTML =
      `${formatCN(curDate)} · 星期${wd}` +
      (curDate === todayStr() ? ' <span class="today-chip">今天</span>' : '');

    // 列表
    const list = document.getElementById('list');
    const fab = document.getElementById('fab');
    const isFuture = curDate > todayStr();
    // 未来日期：可查看但不能记，隐藏加号
    fab.classList.toggle('hide', isFuture);

    if (isFuture) {
      list.innerHTML = '<div class="empty future-hint"><span class="empty-icon">🕰️</span>这一天还没到<br>到了那天再来记吧</div>';
      return;
    }
    if (dayBills.length === 0) {
      list.innerHTML = '<div class="empty"><span class="empty-icon">🧾</span>这一天还没有记录<br>点击右下角 + 开始记账</div>';
      return;
    }
    list.innerHTML = dayBills.map((b, i) => {
      const cat = CATEGORIES[b.type].find(c => c.id === b.cat) || { emoji: b.type === 'expense' ? '📦' : '💰', name: b.type === 'expense' ? '其他' : '收入' };
      return `
      <div class="bill" data-id="${b.ts}">
        <div class="bill-actions">
          <button class="swipe-edit" data-edit="${b.ts}">编辑</button>
          <button class="swipe-del" data-del="${b.ts}">删除</button>
        </div>
        <div class="bill-main">
          <div class="icon ${b.type}">${cat.emoji}</div>
          <div class="info">
            <div class="name">${cat.name}${b.note ? ' · ' + escapeHTML(b.note) : ''}</div>
            <div class="time">${b.time}</div>
          </div>
          <div class="num ${b.type}">${b.type === 'expense' ? '-' : '+'}¥${b.amount.toFixed(2)}</div>
        </div>
      </div>
    `; }).join('');
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // ===== 账单卡片交互：点按揭示右侧删除（苹果式动画） =====
  const listEl = document.getElementById('list');

  function collapseAll() {
    listEl.querySelectorAll('.bill.expanded').forEach(b => b.classList.remove('expanded'));
  }

  listEl.addEventListener('click', e => {
    // 点击删除按钮
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      const card = delBtn.closest('.bill');
      card.classList.add('removing');
      // 等动画结束后再真正删除并重绘
      setTimeout(() => {
        const id = +delBtn.dataset.del;
        bills = bills.filter(b => b.ts !== id);
        saveBills(bills);
        renderDay();
        renderMonth();
      }, 400);
      return;
    }
    // 点击编辑按钮：进入编辑模式
    const editBtn = e.target.closest('[data-edit]');
    if (editBtn) {
      startEdit(+editBtn.dataset.edit);
      return;
    }
    // 点击卡片主体：揭示/收起右侧删除（同时收起其他卡片）
    const main = e.target.closest('.bill-main');
    if (main) {
      const card = main.parentElement;
      const wasOpen = card.classList.contains('expanded');
      collapseAll();
      if (!wasOpen) card.classList.add('expanded');
    }
  });

  // 点击空白处（卡片以外）收起所有展开的删除按钮
  document.addEventListener('click', e => {
    if (!e.target.closest('.bill')) collapseAll();
  });

  // ===== 左滑手势：跟手拖拽，松手吸附（iOS 邮件交互） =====
  const SWIPE_OPEN = 168;   // 完全展开位移
  const SWIPE_THRESHOLD = 84; // 过半即吸附展开

  let swipe = null;   // { card, main, startX, startY, locked }

  function setMainX(main, x, animate) {
    main.classList.toggle('dragging', !animate);
    main.style.transform = x === null ? '' : `translateX(${x}px)`;
  }

  listEl.addEventListener('touchstart', e => {
    const card = e.target.closest('.bill');
    if (!card) { swipe = null; return; }
    swipe = {
      card,
      main: card.querySelector('.bill-main'),
      startX: e.touches[0].clientX,
      startY: e.touches[0].clientY,
      startOpen: card.classList.contains('expanded') ? -SWIPE_OPEN : 0,
      locked: false
    };
  }, { passive: true });

  listEl.addEventListener('touchmove', e => {
    if (!swipe) return;
    const dx = e.touches[0].clientX - swipe.startX;
    const dy = e.touches[0].clientY - swipe.startY;
    if (!swipe.locked) {
      // 水平意图判定：横向位移大于纵向且超过 10px 才进入拖拽，避免干扰滚动
      if (Math.abs(dx) < 10 || Math.abs(dx) <= Math.abs(dy)) return;
      swipe.locked = true;
      swipe.card.classList.remove('expanded');   // 转为内联拖拽控制
      setMainX(swipe.main, swipe.startOpen, false);
    }
    // 起点含已展开偏移；橡皮筋阻尼：超过展开宽度后按 30% 跟随
    let x = swipe.startOpen + dx;
    if (x < -SWIPE_OPEN) x = -SWIPE_OPEN + (x + SWIPE_OPEN) * 0.3;
    if (x > 0) x = 0;
    swipe.base = x;
    setMainX(swipe.main, x, false);
  }, { passive: true });

  listEl.addEventListener('touchend', () => {
    if (!swipe) return;
    const { card, main, locked, base } = swipe;
    if (locked) {
      // 过半吸附展开，否则弹回；同时淡入/淡出操作按钮
      if (base < -SWIPE_THRESHOLD) card.classList.add('expanded');
      else card.classList.remove('expanded');
      setMainX(main, null, true);   // 清除内联值，交还给 .expanded 类过渡
    }
    swipe = null;
  }, { passive: true });
  listEl.addEventListener('touchcancel', () => { swipe = null; }, { passive: true });

  // ===== 键盘面板 =====
  const sheet = document.getElementById('sheet');
  const mask  = document.getElementById('mask');
  let editingId = null;   // 非空表示正在编辑已有记录

  function openSheet() {
    if (curDate > todayStr()) return;   // 未来日期禁止记账
    editingId = null;
    document.getElementById('saveBtn').textContent = '保存';
    amount = '0';
    curType = 'expense';
    curCat = 'food';
    setType('expense');
    document.getElementById('noteInput').value = '';
    updateAmountDisplay();
    sheet.classList.add('show');
    mask.classList.add('show');
  }

  // 编辑已有记录：预填类型/分类/金额/备注
  function startEdit(id) {
    const b = bills.find(x => x.ts === id);
    if (!b) return;
    editingId = id;
    document.getElementById('saveBtn').textContent = '更新';
    curDate = b.date;          // 回到该记录所在日期的日视图
    setType(b.type);
    curCat = b.cat;
    renderCategories();
    amount = String(b.amount);
    document.getElementById('noteInput').value = b.note || '';
    updateAmountDisplay();
    collapseAll();
    sheet.classList.add('show');
    mask.classList.add('show');
  }

  function closeSheet() {
    editingId = null;
    sheet.classList.remove('show');
    mask.classList.remove('show');
  }

  function setType(type) {
    curType = type;
    // 切换类型时重置为该类型的第一个分类
    curCat = CATEGORIES[type][0].id;
    const btnExp = document.getElementById('btnExpense');
    const btnInc = document.getElementById('btnIncome');
    const disp = document.getElementById('amountDisplay');
    btnExp.className = type === 'expense' ? 'active-expense' : '';
    btnInc.className = type === 'income' ? 'active-income' : '';
    disp.className = `amount-display ${type}-mode show-caret`;
    renderCategories();
  }

  // ===== 金额输入（字符串操作，防止浮点问题） =====
  function pressKey(key) {
    if (key === 'del') {
      amount = amount.length > 1 ? amount.slice(0, -1) : '0';
    } else if (key === 'clear') {
      amount = '0';
    } else if (key === '.') {
      if (!amount.includes('.')) amount += '.';
    } else if (key === '00') {
      if (amount !== '0') amount = limitDecimals(amount + '00');
    } else { // 数字
      if (amount === '0') amount = key;
      else amount = limitDecimals(amount + key);
    }
    // 长度限制（最多 8 位整数）
    const [int, dec] = amount.split('.');
    if (int.length > 8) amount = int.slice(0, 8) + (dec !== undefined ? '.' + dec : '');
    updateAmountDisplay();
  }

  function limitDecimals(s) {
    const i = s.indexOf('.');
    if (i === -1) return s;
    return s.slice(0, i + 3); // 最多 2 位小数
  }

  function updateAmountDisplay() {
    document.getElementById('amountInput').textContent = amount || '0';
    document.getElementById('saveBtn').disabled = parseFloat(amount) <= 0;
  }

  // ===== 保存（新增 or 更新） =====
  function saveBill() {
    const val = parseFloat(amount);
    if (!val || val <= 0) return;
    const note = document.getElementById('noteInput').value.trim();

    if (editingId !== null) {
      // 编辑模式：保留原日期和时间，只更新内容
      const idx = bills.findIndex(x => x.ts === editingId);
      if (idx === -1) return;
      bills[idx] = { ...bills[idx], type: curType, cat: curCat, amount: val, note };
    } else {
      // 新增模式：记到当前查看的日期（未来日期已在入口拦截）
      if (curDate > todayStr()) return;
      const now = new Date();
      bills.push({
        date: curDate,
        type: curType,
        cat: curCat,
        amount: val,
        note,
        time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        ts: now.getTime()
      });
    }
    saveBills(bills);
    document.getElementById('noteInput').value = '';
    editingId = null;
    renderDay();
    renderMonth();   // 同步刷新月视图汇总
    closeSheet();
  }

  // ===== 事件绑定 =====
  document.getElementById('fab').addEventListener('click', openSheet);
  mask.addEventListener('click', closeSheet);
  document.getElementById('keypad').addEventListener('click', e => {
    const key = e.target.dataset && e.target.dataset.key;
    if (key === 'save') saveBill();
    else if (key) pressKey(key);
  });
  document.getElementById('backBtn').addEventListener('click', showMonth);
  document.getElementById('prevMonth').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderMonth();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderMonth();
  });
  document.getElementById('calendar').addEventListener('click', e => {
    const cell = e.target.closest('.cal-cell[data-date]');
    if (!cell) return;
    curDate = cell.dataset.date;
    showDay();
  });

  // 初始化：默认打开当日视图（月视图作为底层屏幕被推入）
  // 数据自愈：清除历史上误记到未来的记录（时间未到不可能发生真实消费）
  const today = todayStr();
  const cleaned = bills.filter(b => b.date <= today);
  if (cleaned.length !== bills.length) {
    bills = cleaned;
    saveBills(bills);
  }
  renderMonth();
  updateAmountDisplay();
  showDay();
</script>
</body>
</html>
